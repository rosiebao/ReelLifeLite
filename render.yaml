# Render Blueprint. The app (package.json, app.js) lives in src/, not the repo
# root, so rootDir is required -- without it `npm install` fails with
# "Could not read package.json".
services:
  - type: web
    name: reellife
    runtime: node
    rootDir: src
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_PATH
        value: /data
      - key: MEDIA_ROOT
        value: /data/conversation_files
    # SQLite + transcripts must survive redeploys. Disks need a paid plan.
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
